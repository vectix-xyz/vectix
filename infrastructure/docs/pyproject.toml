[project]
name = "btm-docs"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "docxtpl>=0.20.2",
    "fastapi[standard]>=0.140.7",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-barcode>=0.16.1",
    "python-docx>=1.2.0",
    "scalar-fastapi>=1.8.2",
    "segno>=1.6.6",
    "typst>=0.15.0",
    "uvicorn>=0.51.0",
]

[tool.fastapi]
entrypoint = "main:app"
host = "0.0.0.0"
port = 4200

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
